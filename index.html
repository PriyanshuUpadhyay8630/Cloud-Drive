<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CloudVault Pro - Mobile Cloud Manager</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #0f172a;
            --surface: #1e293b;
            --surface-card: #334155;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --danger: #ef4444;
            --success: #10b981;
            --radius-lg: 20px;
            --radius-md: 12px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* Auth Screen */
        .auth-container { display: flex; justify-content: center; align-items: center; height: 100vh; padding: 20px; background: radial-gradient(circle at top, #1e1b4b 0%, var(--bg) 100%); }
        .auth-box { background: rgba(30, 41, 59, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: var(--radius-lg); padding: 32px 24px; width: 100%; max-width: 380px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5); }
        .auth-header { text-align: center; margin-bottom: 28px; }
        .auth-header i { font-size: 2.8rem; color: var(--primary); margin-bottom: 10px; }
        .auth-header h2 { font-size: 1.6rem; font-weight: 700; color: #fff; }

        /* App Layout */
        #appScreen { display: none; height: 100vh; flex-direction: column; width: 100vw; }
        .mobile-header { background: var(--surface); padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 10; }
        .brand { font-weight: 700; font-size: 1.1rem; display: flex; align-items: center; gap: 8px; color: #fff; }
        .user-badge { font-size: 0.8rem; background: rgba(99, 102, 241, 0.15); color: var(--primary); padding: 4px 10px; border-radius: 20px; font-weight: 600; border: 1px solid rgba(99, 102, 241, 0.3); }

        .main-content { flex: 1; overflow-y: auto; padding: 20px; padding-bottom: 90px; }

        /* Nav Tab Components */
        .tab-content { display: none; animation: fadeIn 0.2s ease-in-out; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

        /* Dashboard UI Elements */
        .storage-card { background: linear-gradient(135deg, #4f46e5 0%, #3730a3 100%); border-radius: var(--radius-lg); padding: 22px; color: #fff; margin-bottom: 20px; box-shadow: 0 10px 20px rgba(79, 70, 229, 0.25); }
        .progress-bar-bg { background: rgba(255, 255, 255, 0.2); height: 8px; border-radius: 10px; margin: 14px 0 8px 0; overflow: hidden; }
        .progress-fill { background: #fff; height: 100%; width: 0%; transition: width 0.4s ease; }

        .grid-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 20px; }
        .stat-box { background: var(--surface); border: 1px solid var(--border); padding: 16px; border-radius: var(--radius-md); text-align: center; }
        .stat-box h4 { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; margin-bottom: 6px; }
        .stat-box .val { font-size: 1.4rem; font-weight: 700; color: #fff; }

        .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 20px; margin-bottom: 16px; }

        /* Form Controls */
        label { font-size: 0.85rem; font-weight: 600; color: var(--text-muted); display: block; margin-bottom: 6px; }
        input[type="text"], input[type="password"], input[type="email"], input[type="file"] { width: 100%; padding: 12px 14px; margin-bottom: 16px; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-md); color: #fff; font-size: 0.9rem; }
        input:focus { border-color: var(--primary); outline: none; }

        .btn { width: 100%; padding: 13px; border-radius: var(--radius-md); border: none; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 0.95rem; transition: 0.2s; }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-primary:active { transform: scale(0.98); }
        .btn-danger { background: rgba(239, 68, 68, 0.15); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.3); padding: 8px; font-size: 0.8rem; }

        /* Dynamic Lists */
        .item-list { display: flex; flex-direction: column; gap: 10px; }
        .item-row { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 14px; display: flex; justify-content: space-between; align-items: center; }
        .item-info { display: flex; align-items: center; gap: 12px; }
        .item-info i { font-size: 1.2rem; color: var(--primary); }

        /* Mobile Bottom Bar */
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface); border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 10px 0; z-index: 100; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--text-muted); text-decoration: none; font-size: 0.72rem; gap: 4px; cursor: pointer; width: 20%; }
        .nav-item i { font-size: 1.2rem; }
        .nav-item.active { color: var(--primary); font-weight: 600; }
    </style>
</head>
<body>

    <!-- Auth Screen -->
    <div id="authScreen" class="auth-container">
        <div class="auth-box">
            <div class="auth-header">
                <i class="fa-solid fa-cloud-arrow-up"></i>
                <h2>CloudVault Pro</h2>
            </div>
            <form onsubmit="handleLogin(event)">
                <label>Username</label>
                <input type="text" id="loginUser" required placeholder="admin / user1">
                <label>Password</label>
                <input type="password" id="loginPass" required placeholder="••••••••">
                <button type="submit" class="btn btn-primary"><i class="fa-solid fa-right-to-bracket"></i> Login</button>
            </form>
        </div>
    </div>

    <!-- App Dashboard Screen -->
    <div id="appScreen">
        <div class="mobile-header">
            <div class="brand"><i class="fa-solid fa-cloud-arrow-up" style="color: var(--primary);"></i> CloudVault</div>
            <div class="user-badge" id="welcomeMsg">User</div>
        </div>

        <div class="main-content">
            <!-- Dashboard Tab -->
            <div id="tab-dash" class="tab-content active">
                <div class="storage-card">
                    <div style="display:flex; justify-content:space-between; font-size:0.85rem; opacity:0.9;">
                        <span>Live Storage Usage</span>
                        <i class="fa-solid fa-database"></i>
                    </div>
                    <div style="font-size: 1.8rem; font-weight:700; margin-top:8px;">
                        <span id="used-storage">0</span> GB <span style="font-size:0.9rem; font-weight:normal; opacity:0.8;">/ <span id="total-storage">--</span> GB</span>
                    </div>
                    <div class="progress-bar-bg">
                        <div class="progress-fill" id="storageProgress"></div>
                    </div>
                </div>

                <div class="grid-stats">
                    <div class="stat-box">
                        <h4>Connected Nodes</h4>
                        <div class="val" id="statNodes">0</div>
                    </div>
                    <div class="stat-box">
                        <h4>Files Managed</h4>
                        <div class="val" id="statFiles" style="color:var(--primary);">0</div>
                    </div>
                </div>

                <div class="card">
                    <h3 style="font-size:0.95rem; margin-bottom:6px;"><i class="fa-solid fa-shield-halved" style="color:var(--primary);"></i> Cloud Architecture</h3>
                    <p style="color:var(--text-muted); font-size:0.82rem; line-height:1.5;">Multi-Gmail architecture client-side browser storage and Google Apps Script nodes sync.</p>
                </div>
            </div>

            <!-- Upload Tab -->
            <div id="tab-upload" class="tab-content">
                <h3 style="margin-bottom:16px;">Upload File</h3>
                <div class="card">
                    <label>Select File</label>
                    <input type="file" id="fileInput">
                    <button onclick="uploadFile()" class="btn btn-primary"><i class="fa-solid fa-cloud-arrow-up"></i> Upload File</button>
                </div>
            </div>

            <!-- Accounts Tab -->
            <div id="tab-accounts" class="tab-content">
                <h3 style="margin-bottom:16px;">Gmail Nodes</h3>
                <div class="card">
                    <form onsubmit="handleAddAccount(event)">
                        <label>Connect Gmail Node (14GB Limit)</label>
                        <input type="email" id="newEmail" placeholder="node@gmail.com" required>
                        <button type="submit" class="btn btn-primary"><i class="fa-solid fa-plus"></i> Add Node</button>
                    </form>
                </div>
                <div class="item-list" id="accountsList"></div>
            </div>

            <!-- Files Tab -->
            <div id="tab-files" class="tab-content">
                <h3 style="margin-bottom:16px;">Files List</h3>
                <div class="item-list" id="filesList"></div>
            </div>
        </div>

        <!-- Bottom Navigation Bar -->
        <div class="bottom-nav">
            <div class="nav-item active" onclick="switchTab('dash')" id="menu-dash"><i class="fa-solid fa-chart-pie"></i>Dashboard</div>
            <div class="nav-item" onclick="switchTab('upload')" id="menu-upload"><i class="fa-solid fa-upload"></i>Upload</div>
            <div class="nav-item" onclick="switchTab('accounts')" id="menu-accounts"><i class="fa-brands fa-google"></i>Nodes</div>
            <div class="nav-item" onclick="switchTab('files')" id="menu-files"><i class="fa-solid fa-folder"></i>Files</div>
            <div class="nav-item" onclick="handleLogout()" style="color:var(--danger);"><i class="fa-solid fa-power-off"></i>Logout</div>
        </div>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwb77ntXmTVMY4VaEpXVaysnQT48YwJaXy7TsvlXAAEij6e44Id4iuIpy6jMBCiKmTO7w/exec";

        let db = JSON.parse(localStorage.getItem('cloudVaultDB')) || {
            user: null,
            accounts: [{ id: 1, email: "node1@gmail.com", limit: 14, used: 0 }],
            files: []
        };

        function saveDB() {
            localStorage.setItem('cloudVaultDB', JSON.stringify(db));
        }

        function checkAuth() {
            if (db.user) {
                document.getElementById('authScreen').style.display = 'none';
                document.getElementById('appScreen').style.display = 'flex';
                document.getElementById('welcomeMsg').innerText = db.user;
                renderData();
                fetchStorage();
            } else {
                document.getElementById('authScreen').style.display = 'flex';
                document.getElementById('appScreen').style.display = 'none';
            }
        }

        function handleLogin(e) {
            e.preventDefault();
            const u = document.getElementById('loginUser').value.trim();
            const p = document.getElementById('loginPass').value.trim();
            if ((u === 'admin' && p === 'adminpassword') || (u === 'user1' && p === 'user123')) {
                db.user = u;
                saveDB();
                checkAuth();
            } else {
                alert('Invalid Credentials!');
            }
        }

        function handleLogout() {
            db.user = null;
            saveDB();
            checkAuth();
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            document.getElementById('tab-' + tabName).classList.add('active');
            document.getElementById('menu-' + tabName).classList.add('active');
            renderData();
        }

        async function fetchStorage() {
            try {
                let response = await fetch(WEB_APP_URL);
                let data = await response.json();
                document.getElementById("used-storage").innerText = data.used || "0";
                document.getElementById("total-storage").innerText = data.total || "14";
                if(data.used && data.total) {
                    let pct = (parseFloat(data.used) / parseFloat(data.total)) * 100;
                    document.getElementById("storageProgress").style.width = Math.min(pct, 100) + "%";
                }
            } catch (error) {
                console.error("Storage fetch error:", error);
            }
        }

        async function uploadFile() {
            let fileInput = document.getElementById("fileInput");
            if (fileInput.files.length === 0) {
                alert("Pehle file select karein!");
                return;
            }
            let file = fileInput.files[0];
            let reader = new FileReader();
            reader.onload = async function() {
                let base64Data = reader.result.split(',')[1];
                let payload = { filename: file.name, mimeType: file.type, bytes: base64Data };
                alert("Uploading... Kripya intezaar karein.");
                try {
                    let response = await fetch(WEB_APP_URL, { method: "POST", body: JSON.stringify(payload) });
                    let result = await response.json();
                    if (result.status === "success") {
                        alert("File successfully upload ho gayi!");
                        db.files.push({ id: Date.now(), name: file.name, size: (file.size/(1024*1024)).toFixed(2) + " MB", node: "Drive App" });
                        saveDB();
                        fileInput.value = '';
                        fetchStorage();
                        switchTab('files');
                    } else {
                        alert("Upload fail ho gaya: " + result.message);
                    }
                } catch(e) {
                    alert("Upload request error!");
                }
            };
            reader.readAsDataURL(file);
        }

        function handleAddAccount(e) {
            e.preventDefault();
            const email = document.getElementById('newEmail').value.trim();
            if(email) {
                db.accounts.push({ id: Date.now(), email: email, limit: 14, used: 0 });
                saveDB();
                document.getElementById('newEmail').value = '';
                renderData();
            }
        }

        function deleteAccount(id) {
            db.accounts = db.accounts.filter(acc => acc.id !== id);
            saveDB();
            renderData();
        }

        function renderData() {
            document.getElementById('statNodes').innerText = db.accounts.length;
            document.getElementById('statFiles').innerText = db.files.length;

            const accList = document.getElementById('accountsList');
            accList.innerHTML = db.accounts.length === 0 ? '<p style="color:var(--text-muted); text-align:center;">No nodes connected.</p>' : '';
            db.accounts.forEach(acc => {
                accList.innerHTML += `
                    <div class="item-row">
                        <div class="item-info">
                            <i class="fa-brands fa-google"></i>
                            <div>
                                <div style="font-weight:600; font-size:0.85rem;">${acc.email}</div>
                                <div style="font-size:0.75rem; color:var(--text-muted);">${acc.limit} GB Limit</div>
                            </div>
                        </div>
                        <button onclick="deleteAccount(${acc.id})" class="btn btn-danger"><i class="fa-solid fa-trash"></i></button>
                    </div>`;
            });

            const filesList = document.getElementById('filesList');
            filesList.innerHTML = db.files.length === 0 ? '<p style="color:var(--text-muted); text-align:center;">No files uploaded.</p>' : '';
            db.files.forEach(f => {
                filesList.innerHTML += `
                    <div class="item-row">
                        <div class="item-info">
                            <i class="fa-solid fa-file"></i>
                            <div>
                                <div style="font-weight:600; font-size:0.85rem;">${f.name}</div>
                                <div style="font-size:0.75rem; color:var(--text-muted);">${f.size} • ${f.node}</div>
                            </div>
                        </div>
                    </div>`;
            });
        }

        window.onload = checkAuth;
    </script>
</body>
</html>
