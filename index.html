<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login Panel</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #0f172a; color: #fff; }
        .login-card { background: #1e293b; padding: 30px; border-radius: 12px; width: 90%; max-width: 380px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .login-card h2 { margin-bottom: 20px; text-align: center; color: #38bdf8; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; margin-bottom: 5px; font-size: 14px; color: #94a3b8; }
        .input-group input { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #fff; outline: none; }
        button { width: 100%; padding: 12px; border: none; border-radius: 6px; background: #0284c7; color: white; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background: #0369a1; }
        #msg { margin-top: 15px; text-align: center; font-size: 14px; }
    </style>
</head>
<body>

<div class="login-card">
    <h2>Admin Access</h2>
    <form id="adminLoginForm">
        <div class="input-group">
            <label>Username</label>
            <input type="text" id="username" required>
        </div>
        <div class="input-group">
            <label>Password</label>
            <input type="password" id="password" required>
        </div>
        <button type="submit" id="submitBtn">Login</button>
    </form>
    <div id="msg"></div>
</div>

<script>
    // App Script Ka Web App URL yahan paste karo
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby-WW0rQBjF_L7EVatkqIL-hqw6_ZaGZc2ZepTTyLQpf4sokCsV2zSovW2G2eFdNLTh6g/exec";

    document.getElementById("adminLoginForm").addEventListener("submit", function(e) {
        e.preventDefault(); // Page reloading ko rokta hai

        const userVal = document.getElementById("username").value;
        const passVal = document.getElementById("password").value;
        const msgBox = document.getElementById("msg");
        const btn = document.getElementById("submitBtn");

        msgBox.style.color = "#38bdf8";
        msgBox.innerText = "Checking credentials...";
        btn.disabled = true;

        fetch(SCRIPT_URL, {
            method: "POST",
            mode: "cors",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify({
                action: "login",
                username: userVal,
                password: passVal
            })
        })
        .then(res => res.json())
        .then(data => {
            btn.disabled = false;
            if (data.status === "success") {
                msgBox.style.color = "#4ade80";
                msgBox.innerText = "Login Successful! Redirecting...";
                
                // Login hone ke baad Dashboard par redirect karega
                setTimeout(() => {
                    window.location.href = "dashboard.html"; // Aapke Dashboard page ka name
                }, 1000);
            } else {
                msgBox.style.color = "#f87171";
                msgBox.innerText = data.message || "Wrong Username/Password!";
            }
        })
        .catch(err => {
            btn.disabled = false;
            msgBox.style.color = "#f87171";
            msgBox.innerText = "Connection Error! Try Again.";
            console.error(err);
        });
    });
</script>

</body>
</html>
