<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal & Storage Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 450px;
        }

        .card {
            background: #1e293b;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            border: 1px solid #334155;
        }

        h2 {
            margin-bottom: 20px;
            text-align: center;
            color: #38bdf8;
            font-size: 24px;
        }

        .input-group {
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            color: #94a3b8;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
        }

        .input-group input:focus {
            border-color: #38bdf8;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #0284c7;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #0369a1;
        }

        button:disabled {
            background: #475569;
            cursor: not-allowed;
        }

        #msg {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
        }

        /* Dashboard Styles */
        .hidden {
            display: none;
        }

        .dashboard-card {
            background: #1e293b;
            padding: 30px;
            border-radius: 16px;
            width: 100%;
            max-width: 600px;
            border: 1px solid #334155;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        }

        .welcome-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            border-bottom: 1px solid #334155;
            padding-bottom: 15px;
        }

        .logout-btn {
            width: auto;
            padding: 8px 16px;
            background: #ef4444;
            font-size: 14px;
        }

        .logout-btn:hover {
            background: #dc2626;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .stat-box {
            background: #0f172a;
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #334155;
            text-align: center;
        }

        .stat-box h3 {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .stat-box p {
            font-size: 22px;
            color: #38bdf8;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- 1. Login View -->
    <div class="container" id="loginContainer">
        <div class="card">
            <h2>Admin Login</h2>
            <form id="adminLoginForm">
                <div class="input-group">
                    <label>Username</label>
                    <input type="text" id="username" placeholder="Username dalein" required>
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="Password dalein" required>
                </div>
                <button type="submit" id="submitBtn">Login</button>
            </form>
            <div id="msg"></div>
        </div>
    </div>

    <!-- 2. Dashboard View -->
    <div class="dashboard-card hidden" id="dashboardContainer">
        <div class="welcome-header">
            <div>
                <h2>Admin Control Panel</h2>
                <p style="color: #94a3b8; font-size: 14px;">Welcome back, Admin!</p>
            </div>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>

        <div class="stats-grid">
            <div class="stat-box">
                <h3>Backend Status</h3>
                <p style="color: #4ade80;">Connected</p>
            </div>
            <div class="stat-box">
                <h3>Access Role</h3>
                <p>Administrator</p>
            </div>
        </div>
    </div>

    <script>
        // Apne Apps Script Ka Web App URL Yahan Update Karein
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby-WW0rQBjF_L7EVatkqIL-hqw6_ZaGZc2ZepTTyLQpf4sokCsV2zSovW2G2eFdNLTh6g/exec";

        document.getElementById("adminLoginForm").addEventListener("submit", function(e) {
            e.preventDefault();

            const userVal = document.getElementById("username").value;
            const passVal = document.getElementById("password").value;
            const msgBox = document.getElementById("msg");
            const btn = document.getElementById("submitBtn");

            msgBox.style.color = "#38bdf8";
            msgBox.innerText = "Checking credentials...";
            btn.disabled = true;

            const payload = new URLSearchParams();
            payload.append("action", "login");
            payload.append("username", userVal);
            payload.append("password", passVal);

            fetch(SCRIPT_URL, {
                method: "POST",
                body: payload
            })
            .then(res => res.json())
            .then(data => {
                btn.disabled = false;
                if (data.status === "success") {
                    msgBox.style.color = "#4ade80";
                    msgBox.innerText = "Login Successful! Loading Dashboard...";
                    
                    setTimeout(() => {
                        // Hide Login Card & Show Dashboard
                        document.getElementById("loginContainer").classList.add("hidden");
                        document.getElementById("dashboardContainer").classList.remove("hidden");
                    }, 1000);
                } else {
                    msgBox.style.color = "#f87171";
                    msgBox.innerText = data.message || "Ghalat Credentials!";
                }
            })
            .catch(err => {
                btn.disabled = false;
                msgBox.style.color = "#f87171";
                msgBox.innerText = "Connection Error! Check Console.";
                console.error("Fetch Error:", err);
            });
        });

        function logout() {
            // Reset Form and Switch UI Back to Login
            document.getElementById("adminLoginForm").reset();
            document.getElementById("msg").innerText = "";
            document.getElementById("dashboardContainer").classList.add("hidden");
            document.getElementById("loginContainer").classList.remove("hidden");
        }
    </script>

</body>
</html>
